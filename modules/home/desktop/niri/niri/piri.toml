# Piri Configuration File
# Copy this file to ~/.config/niri/piri.toml

[niri]
# Optional: Path to niri socket
# If not specified, will use $XDG_RUNTIME_DIR/niri or /tmp/niri
# socket_path = "/tmp/niri"

# Plugin control: enable/disable plugins
# If not specified, plugins are disabled by default
[piri.plugins]
scratchpads = true
empty = false
window_rule = true
autofill = true
singleton = true
window_order = true
swallow = true
workspace_rule = true
fcitx5 = true
sleepy = true

[piri.scratchpad]
default_size = "40% 60%"
default_margin = 50

[scratchpads.musicfox]
direction = "fromTop"
command = "kitty --class musicfox musicfox"
app_id = "float.musicfox"
size = "60% 40%"
margin = 150

[empty.1]
command = "vesktop ; zen ; linuxqq"

[empty.2]
command = "kitty"

# Sleepy plugin: push focused app/window info to Sleepy server
# Requires sleepy server endpoint and device metadata
[sleepy]
server_url = "https://sleepy.rhen.cloud"
device_id = "nixos-desktop"
device_name = "NixOS Desktop"
# Optional: bearer token (recommended if your server uses token auth)
token = "ljr811226"
# Optional: secret field for deployments requiring secret in payload
secret = ""
# If true, use app_id as status text first; otherwise use window title
prefer_app_id = false

[[fcitx5]]
app_id = "zen"
input_mode = "english"

[[fcitx5]]
app_id = "kitty"
input_mode = "english"

[[fcitx5]]
app_id = "code"
input_mode = "english"

[[fcitx5]]
app_id = "QQ"
input_mode = "chinese"

[[fcitx5]]
app_id = "wechat"
input_mode = "chinese"

[[fcitx5]]
app_id = "vesktop"
input_mode = "chinese"

[[fcitx5]]
app_id = "dev.zed.Zed"
input_mode = "english"
