switches_engine:
    switches:
        - name: emoji_suggestion
          reset: 0
          states: ["😭", "🙂"]
        - name: traditionalization
          states: [简, 繁]
        - name: full_shape
          reset: 0
          states: [半角, 全角]
        - name: ascii_punct
          reset: 0
          states: [。，, ．，]
        # - name: phraseReplace # 敏感词输出开关
        #   reset: 1
        #   states: [Off, 👙]
        - name: ascii_mode
          reset: 0 # 通过 reset 设置初始值 0 代表第一项
          states: [中文, 西文]
        # - name: zrm_tishi
        #   reset: 1
        #   states: [ 启用 , 禁用 ]
        # - name: chaifen
        #   reset: 1
        #   states: [ 不拆, 扌斥 ]
        # - name: pinyin_single
        #   reset: 0
        #   states: [ 禁用, 字拼]

    engine:
        processors:
            # - lua_processor@*sbxlm.key_binder # 绑定按键
            - lua_processor@cold_word_drop_processor
            - lua_processor@select_character
            - ascii_composer
            - recognizer
            - key_binder
            - speller
            - punctuator
            - selector
            - navigator
            - express_editor
        segmentors:
            - ascii_segmentor
            - matcher
            - abc_segmentor
            - punct_segmentor
            - affix_segmentor@add_user_dict
            - fallback_segmentor
        translators:
            - lua_translator@*mint_date_time_translator # 时间、日期、星期、月份
            - lua_translator@*force_gc # 暴力GC，尝试解决小狼毫长期使用的卡顿
            - punct_translator
            # - table_translator@melt_eng # 英文输入
            - reverse_lookup_translator
            - script_translator
            # - script_translator@user_dict_set
            # - script_translator@add_user_dict
        filters:
            # - lua_filter@*aux_code@ZRM_Aux-code_4.3
            - lua_filter@*aux_code@jd
            # - lua_filter@*aux_code@jd2
            - reverse_lookup_filter@reverse_lookup
            # - lua_filter@*show_cand_type_filter
            # - lua_filter@corrector                          # 错音错字提示
            # - lua_filter@pin_cand_filter                    # 置顶候选项（顺序要求：置顶候选项 > Emoji > 简繁切换）
            # - lua_filter@*is_in_user_dict
            # - lua_filter@*stick
            # - lua_filter@long_phrase_first # 最长词组和单字优先
            # - lua_filter@*long_word_filter # 长词优先（顺序要求：长词优先 > Emoji）
            # - lua_filter@single_char_first # 单字优先
            # - lua_filter@phrase_replace_filter
            - lua_filter@*cand_escape_filter
            - lua_filter@cold_word_drop_filter
            - simplifier@emoji_suggestion
            - lua_filter@*reduce_emoji_filter # 按需启用，作用是降低Emoji在候选项中的位置排序(顺序要求：Emoji > 降低排序)
            - simplifier@traditionalize # 简繁切换
            - uniquifier

# lua:
# corrector: "{comment}"

opencc_config:
    traditionalize:
        option_name: traditionalization
        opencc_config: s2t.json # s2t.json | s2hk.json | s2tw.json | s2twp.json
        tips: all # 转换提示: all 都显示 | char 仅单字显示 | none 不显示。
        tags: [abc] # 限制在对应 tag，不对其他如反查的内容做简繁转换

    emoji_suggestion:
        opencc_config: emoji.json
        option_name: emoji_suggestion
        tips: all
        inherit_comment: true

guide:
    punctuator:
        import_preset: default

    recognizer:
        import_preset: default
        patterns:
            punct: "^;([A-Z|a-z]*|[0-9]|10)$"
            # add_user_dict: "^pm[A-Za-z]*$"

key:
    key_binder:
        import_preset: default
        aux_code_trigger: "/"
        show_aux_notice: true
        bindings:
            - { when: has_menu, accept: "Control+o", toggle: chaifen }
            - { when: has_menu, accept: "Control+l", toggle: chaifen_all }
            - { when: has_menu, accept: "Control+p", toggle: pinyin_single }
            - { when: has_menu, accept: "Up", send: Page_Up }
            - { when: has_menu, accept: "Down", send: Page_Down }
            - { when: has_menu, accept: "Right", send: Down }
            - { when: has_menu, accept: "Left", send: Up }
            # - { when: has_menu, accept: apostrophe, send: 2 }               # 使用单引号二选
            - { when: has_menu, accept: "Control+j", toogle: turn_down_cand } # 匹配当前输入码后隐藏指定的候选字词 或候选词条放到第四候选位置
            - { when: has_menu, accept: "Control+d", toggle: drop_cand } # 强制删词, 无视输入的编码
            # - { when: has_menu, accept: Tab, send: slash }
            - { when: has_menu, accept: Tab, send: Control+Shift+Return } # Tab上屏comment中的词
            # - { match: "[a-z]{1,3}", accept: Tab,  send_sequence: "/1" }
