# Rime schema
# encoding: utf-8

schema:
    schema_id: c
    name: C
    version: "0.20"
    # dependencies:
    # - melt_eng

switches:
    - name: emoji_suggestion
      reset: 0
      states: ["😭", "🙂"]
    - name: traditionalization
      states: [简, 繁]
    - name: full_shape
      reset: 0
      states: [半角, 全角]
    - name: ascii_punct
      reset: 0
      states: [。，, ．，]

engine:
    processors:
        # - lua_processor@*sbxlm.key_binder # 绑定按键
        - lua_processor@cold_word_drop_processor
        - lua_processor@select_character
        - ascii_composer
        - recognizer
        - key_binder
        - speller
        - punctuator
        - selector
        - navigator
        - express_editor
    segmentors:
        - ascii_segmentor
        - matcher
        - abc_segmentor
        - punct_segmentor
        # - affix_segmentor@add_user_dict
        - fallback_segmentor
    translators:
        - lua_translator@*mint_date_time_translator # 时间、日期、星期、月份
        - lua_translator@*force_gc # 暴力GC，尝试解决小狼毫长期使用的卡顿
        - punct_translator
        # - table_translator@melt_eng # 英文输入
        - reverse_lookup_translator
        - script_translator
    filters:
        - lua_filter@*aux_code@ZRM_Aux-code_4.3
        - reverse_lookup_filter@reverse_lookup
        # - lua_filter@*show_cand_type_filter
        # - lua_filter@corrector                          # 错音错字提示
        # - lua_filter@pin_cand_filter                    # 置顶候选项（顺序要求：置顶候选项 > Emoji > 简繁切换）
        # - lua_filter@*is_in_user_dict
        # - lua_filter@*stick
        # - lua_filter@long_phrase_first # 最长词组和单字优先
        # - lua_filter@*long_word_filter # 长词优先（顺序要求：长词优先 > Emoji）
        # - lua_filter@single_char_first # 单字优先
        # - lua_filter@*cand_escape_filter
        # - lua_filter@cold_word_drop_filter
        - simplifier@emoji_suggestion
        - lua_filter@*reduce_emoji_filter # 按需启用，作用是降低Emoji在候选项中的位置排序(顺序要求：Emoji > 降低排序)
        - simplifier@traditionalize # 简繁切换
        - uniquifier

# grammar:
#     # language: zh-hans-t-huayu-v7-bgw
#     language: zhs-fivegrams-3-8
#     collocation_max_length: 8
#     collocation_min_length: 3
#     collocation_penalty: -16
#     non_collocation_penalty: -16
#     weak_collocation_penalty: -20
#     rear_penalty: -24

translator:
    dictionary: rime_ice
    prism: c
    # initial_quality: 1.2 # 拼音的权重应该比英文大
    # enable_completion: true
    # contextual_suggestions: true
    # max_homophones: 2
    # max_homographs: 2
    # enable_encoder: true
    # encode_commit_history: false
    # enable_sentence: true # 禁止造句
    # enable_user_dict: true # 禁用用户词典
    spelling_hints: 2 # corrector.lua ：为了让错音错字提示的 Lua 同时适配全拼双拼，将拼音显示在 comment 中
    # always_show_comments: true  # corrector.lua ：Rime 默认在 preedit 等于 comment 时取消显示 comment，这里强制一直显示，供 corrector.lua 做判断用。
    # comment_format:             # 标记拼音注释，供 corrector.lua 做判断用
    # - xform/^/［/
    # - xform/$/］/
    user_dict: user.custom.dict
    db_class: tabledb
