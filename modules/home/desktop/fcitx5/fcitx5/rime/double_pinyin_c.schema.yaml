translator:
  dictionary: rime_ice
  prism: double_pinyin_c
  initial_quality: 1.2        # 拼音的权重应该比英文大
  enable_completion: true
  contextual_suggestions: true
  max_homophones: 2
  max_homographs: 2
  enable_encoder: true
  # encode_commit_history: false
  enable_sentence: true   # 禁止造句
  enable_user_dict: true  # 禁用用户词典
  spelling_hints: 0           # corrector.lua ：为了让错音错字提示的 Lua 同时适配全拼双拼，将拼音显示在 comment 中
  # always_show_comments: true  # corrector.lua ：Rime 默认在 preedit 等于 comment 时取消显示 comment，这里强制一直显示，供 corrector.lua 做判断用。
  # comment_format:             # 标记拼音注释，供 corrector.lua 做判断用
    # - xform/^/［/
    # - xform/$/］/
  user_dict: user.custom.dict
  db_class: tabledb

