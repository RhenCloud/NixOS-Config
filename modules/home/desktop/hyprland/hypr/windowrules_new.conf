# QQ
windowrule = float on, match:class ^(QQ)$
# windowrule = size 1200 750, match:class ^(QQ)$
windowrule = center on, match:class ^(QQ)$
windowrule = opacity 0.9, match:class ^(QQ)$

# WeChat
windowrule = float on, match:class ^(Wine)$, match:title ^(微信)$
windowrule = float on, match:title ^(".*"的群公告)$
windowrule = no_anim on, match:class ^(wechat.exe)$
windowrule = decorate off, match:class ^(wechat.exe)$
windowrule = no_shadow on, match:class ^(wechat.exe)$
windowrule = no_blur on, match:class ^(wechat.exe)$
windowrule = no_anim on, match:class ^(wechat)$
windowrule = decorate off, match:class ^(wechat)$
windowrule = no_blur on, match:class ^(wechat)$
windowrule = no_shadow on, match:class ^(wechat)$
windowrule = float on, match:class ^(wechat)$
windowrule = float on, match:title ^(微信)$
# windowrule = stay_focused on, match:class ^(wechat)$

# HMCL
windowrule = float on, match:class ^(org.jackhuang.hmcl.Launcher)$

# VSCode
windowrule = opacity 0.95, match:class ^(code)$

# pavucontrol
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = center on, match:class ^(org.pulseaudio.pavucontrol)$
# windowrule = size 750 400, match:class ^(org.pulseaudio.pavucontrol)$

# Clash Verge
windowrule = float on, match:class ^(clash-verge)$
windowrule = center on, match:class ^(clash-verge)$
# windowrule = size 750 450, match:class ^(clash-verge)$

# Prism Launcher
windowrule = float on, match:class ^(org.prismlauncher.PrismLauncher)$
windowrule = no_blur on, match:class ^(org.prismlauncher.PrismLauncher)$
windowrule = center on, match:class ^(org.prismlauncher.PrismLauncher)$
# windowrule = size 900 650, match:class ^(org.prismlauncher.PrismLauncher)$

# KDE Agent
windowrule = float on, match:class ^(.*polkit-kde.*)$

# Flameshot
windowrule = float on, match:title ^(flameshot)
windowrule = move 0 0, match:title ^(flameshot)
windowrule = suppress_event fullscreen, match:title ^(flameshot)
windowrule = no_anim on, match:title ^(flameshot)
windowrule = decorate off, match:title ^(flameshot)
# windowrule = no_shadow on, match:title ^(flameshot)
windowrule = no_blur on, match:title ^(flameshot)

# Alacritty
windowrule = float on, match:class ^(AlacrittyFloating)$

# Gwenview
windowrule = float on, match:class ^(org.kde.gwenview)$
# windowrule = size 1200 750, match:class ^(org.kde.gwenview)$

# OSD Lyrics
windowrule = no_blur on, match:class ^(OSD Lyrics)$, match:title ^(OSD Lyrics)$
# windowrule = no_initial_focus on, match:class ^(OSD Lyrics)$, match:title ^(OSD Lyrics)$
windowrule = pin on, match:class ^(OSD Lyrics)$, match:title ^(OSD Lyrics)$

# YesPlayMusic
windowrule = float on, match:class ^(yesplaymusic)$
windowrule = center on, match:class ^(yesplaymusic)$

# Kitty
windowrule = float on, match:class ^(KittyFloating)$
# windowrule = size 1000 600, match:class ^(KittyFloating)$

# Minecraft
windowrule = float on, match:title ^(Minecraft).*$

# Fcitx5 Config
windowrule = float on, match:class ^(org.fcitx.fcitx5-config-qt)$

# Telegram Desktop
windowrule = maximize on, match:class ^(org.telegram.desktop)$, match:title ^(媒体查看器)$

# Electron NCM
windowrule = float on, match:class ^(electron-netease-cloud-music)$
windowrule = center on, match:class ^(electron-netease-cloud-music)$
# windowrule = size 1200 720, match:class ^(electron-netease-cloud-music)$

# Waylyrics
windowrule {
  name = Waylyrics
  match:class = io.github.waylyrics.Waylyrics

  border_size = 0
  float = on
  size = 1920 100
  move = 0 880
  no_blur = on
  no_initial_focus = on
  pin = on
  dim_around = off
  no_anim = on
  no_blur = on
  no_dim = on
  no_shadow = on
  no_focus = on
}

# Thunar
windowrule = float on, match:class ^(thunar)$, match:title ^(文件操作进度)$

# Hypr Polkit Agent
windowrule = stay_focused on, match:class ^(hyprpolkitagent)$

# Clipse
windowrule = float on, match:class (clipse)
windowrule = size 1100 500, match:class (clipse)
windowrule = stay_focused on, match:class ^(clipse)$
windowrule = no_anim on, match:class ^(clipse)$

# HyprSwitch
windowrule = stay_focused on, match:class ^(hyprswitch)$

# Google Chrome
windowrule = opacity 0.93, match:class ^(google-chrome)$

# WayPaper
windowrule = float on, match:class ^(waypaper)$

# MusicFox
windowrule = float on, match:class ^(musicfox)$
windowrule = center on, match:class ^(musicfox)$
# windowrule = size 1200 700, match:class ^(musicfox)$
windowrule = workspace special:hdrop silent, match:class ^(musicfox)$

# Dolphin
windowrule = stay_focused on, match:title ^(彻底删除 — Dolphin)$
windowrule = stay_focused on, match:title ^(".*"的属性 — Dolphin)$
windowrule = stay_focused on, match:title ^(创建新文件夹 — Dolphin)$
windowrule = float on, match:class ^(org.freedesktop.impl.portal.desktop.kde)$

# Fcitx5
# windowrule = no_blur on, match:class ^(org.fcitx.Fcitx5)$
# windowrule = decorate off, match:class ^(org.fcitx.Fcitx5)$

# Krita
# windowrule = size 750 470, match:class ^(krita)$, match:title ^(正在导出 — Krita)$
windowrule = center on, match:class ^(krita)$, match:title ^(正在导出 — Krita)$
windowrule = center on, match:class ^(krita)$, match:title ^(.* 图像 — Krita)$

# Zoom
windowrule = min_size 1 1, match:class ^(zoom)$, match:title ^(menu window)$
windowrule = stay_focused on, match:class ^(zoom)$, match:title ^(menu window)$
windowrule = no_blur on, match:class ^(zoom)$, match:title ^(annotate_toolbar)$
windowrule = no_blur on, match:class ^(zoom)$, match:title ^(Annotation - Zoom)$

# Shotcut
windowrule = float on, match:title ^(删除.*)$

# LocalSend
# windowrule = fullscreen_state 0 3, match:class ^(localsend)$

# Fcitx5
windowrule = no_dim on, match:class ^(org.fcitx.Fcitx5)$

# Gopeed
windowrule = float on, match:class ^(gopeed)$
