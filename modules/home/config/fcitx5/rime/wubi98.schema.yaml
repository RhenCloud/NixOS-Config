# Rime schema settings
# encoding: utf-8

schema:
  schema_id: wubi98
  name: "五笔98"
  version: "0.10"
  author:
    - 發明人 王永民
  description: |
    五笔98版
    碼表源自 thep0y
    敲 z 鍵進入拼音反查

switches:
  - name: emoji_suggestion
    reset: 1
    states: [ "😭", "🙂" ]
  - name: ascii_punct
    reset: 1
    states: [，。, ，．]
  - name: extended_charset
    states: [通用, 增廣]
  - name: full_shape
    reset: 0
    states: [ 半角, 全角 ]

__include: double_pinyin.yaml:/opencc_config  # opencc配置

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - lua_translator@*force_gc                           # 暴力GC，尝试解决小狼毫长期使用的卡顿
    - punct_translator
    - reverse_lookup_translator
    - table_translator

speller:
  #自动顶屏
  auto_select: true
  #四码唯一时自动上屏
  auto_select_unique_candidate: true

  delimiter: "~"
  max_code_length: 4

translator:
  dictionary: wubi98
  enable_charset_filter: false
  enable_sentence: false
  enable_encoder: false
  encode_commit_history: false
  max_phrase_length: 4

  #逐渐提示
  enable_completion: true
  # enable_completion: false

  enable_user_dict: false
  disable_user_dict_for_patterns:
    - "^z.*$"

reverse_lookup:
  dictionary: rime_ice
  # dictionary: luna_pinyin_extend
  prism : double_pinyin_c
  prefix: "z"
  suffix: "'"
  tips: [双拼]
  # preedit_format:
  #   - xform/([nl])v/$1ü/
  #   - xform/([nl])ue/$1üe/
  #   - xform/([jqxy])v/$1u/

punctuator:
  import_preset: default
key_binder:
  import_preset: default
  bindings:
    - { when: has_menu, accept: "Up", send: Page_Up }
    - { when: has_menu, accept: "Down", send: Page_Down }
    - { when: has_menu, accept: "Right", send: Down }
    - { when: has_menu, accept: "Left", send: Up }

recognizer:
  import_preset: default
  patterns:
    reverse_lookup: "^z[a-z]*'?$"
