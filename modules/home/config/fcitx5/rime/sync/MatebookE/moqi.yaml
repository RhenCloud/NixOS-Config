reverse:
  reverse_moqima:
    tag: reverse_moqima
    dictionary: reverse_moqima
    enable_completion: true
    prefix: "amq"
    suffix: "'"
    tips: 〔墨奇反查〕
    preedit_format:
      # - xlit/hspnz/一丨丿丶乙/

  reverse_chaizi:
    tag: reverse_chaizi
    dictionary: radical_flypy # https://github.com/mirtlecn/rime-radical-pinyin
    enable_completion: true
    prefix: "az"
    suffix: "'"
    tips: 〔部件组字〕
    preedit_format:
      # - xlit/hspnz/一丨丿丶乙/

  reverse_zrlf:
    tag: reverse_zrlf
    dictionary: zrlf
    enable_completion: true
    prefix: "alf"
    suffix: "'"
    tips: 〔自然兩分〕
    preedit_format:
      # - xlit/hspnz/一丨丿丶乙/

  reverse_cj:
