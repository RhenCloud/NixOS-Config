patch:
  # emoji_cn 在 keytao.schema.yaml 的 switches 中位于索引 3，上游默认 reset: 0（关表情）。
  # 这里改为默认开启，F3 或 & 可临时关闭。若上游新增/重排 switches，需要同步调整该索引。
  "switches/@3/reset": 1

  "key/key_binder/bindings/+":
    - { when: has_menu, accept: "F3", toggle: emoji_cn }

      # 翻页 , . 与 [ ]
    - { when: has_menu, accept: comma, send: Page_Up }
    - { when: has_menu, accept: period, send: Page_Down }
    - { when: has_menu, accept: bracketleft, send: Page_Up }
    - { when: has_menu, accept: bracketright, send: Page_Down }
  # "key/key_binder/+":
  #   select_first_character: "bracketleft" # 左中括号 [
  #   select_last_character: "bracketright" # 右中括号 ]

  "recognizer/patterns/+":
    quick_text: "^/(rq|rqcn|sj|ts|unix|uuid|email)$"

  "engine/filters/+":
    - lua_filter@*defer_emoji_filter
    - lua_filter@*promote_custom_phrase
  "engine/processors":
    - ascii_composer
    - recognizer
    - key_binder
    - lua_processor@topup_processor
    - lua_processor@smart_2
    - speller
    - lua_processor@*add_phrase
    - punctuator
    - selector
    - navigator
    - express_editor
  "engine/translators/+":
    - lua_translator@custom_phrase_live
    - lua_translator@quick_text

  custom_phrase:
    initial_quality: 1000000
  ascii_composer:
    good_old_caps_lock: false
    switch_key:
      Caps_Lock: clear
      Shift_L: noop
      Shift_R: noop
      Control_L: noop
      Control_R: noop

  # switches:
  #   - name: sbb_disable_full
  #     reset: 0
  #     states: ["开₆₃₀全码", "关₆₃₀全码"]

  punctuator:
    full_shape:
      " ": { commit: "　" }
      ",": { commit: ， }
      ".": { commit: 。 }
      "<": [《, 〈, «, ‹]
      ">": [》, 〉, », ›]
      "/": [/, ÷]
      "?": { commit: ？ }
      ";": { commit: ； }
      ":": { commit: ： }
      "'": { pair: ["‘", "’"] }
      '"': { pair: ["“", "”"] }
      '\': [、, ＼]
      "|": [·, ｜, "§", "¦"]
      "`": ｀
      "~": ～
      "!": { commit: ！ }
      "@": [＠, ☯]
      "#": [＃, ⌘]
      "%": [％, "°", "℃"]
      "$": [￥, "$", "€", "£", "¥", "¢", "¤"]
      "^": { commit: …… }
      "&": ＆
      "*": [＊, ·, ・, ×, ※, ❂]
      "(": （
      ")": ）
      "-": －
      "_": ——
      "+": ＋
      "=": ＝
      "[": [「, 【, 〔, ［]
      "]": [」, 】, 〕, ］]
      "{": [『, 〖, ｛]
      "}": [』, 〗, ｝]
    half_shape:
      ",": "，"
      ".": "。"
      "<": "⟪"
      ">": "⟫"
      "/": "/"
      "?": "？"
      ";": "；"
      ":": "："
      "'": { pair: ["‘", "’"] }
      '"': { pair: ["“", "”"] }
      '\': "、"
      "|": ["·", "|", "｜", "§", "¦"]
      "`": "、"
      "~": "～"
      "!": "！"
      "@": "@"
      "#": "#"
      "%": "%"
      "$": "¥"
      "^": "…"
      "&": "&"
      "*": "*"
      "(": "（"
      ")": "）"
      "-": "-"
      "_": ——
      "+": "+"
      "=": "="
      "[": "「"
      "]": "」"
      "{": "『"
      "}": "』"
