patch:
  "key/key_binder/bindings/+":
    - { when: has_menu, accept: "F3", toggle: emoji_cn }

      # 翻页 , .
    - { when: has_menu, accept: comma, send: Page_Up }
    - { when: has_menu, accept: period, send: Page_Down }
  # "key/key_binder/+":
  #   select_first_character: "bracketleft" # 左中括号 [
  #   select_last_character: "bracketright" # 右中括号 ]

  "engine/filters/+":
    - lua_filter@*reduce_emoji_filter
    - lua_filter@*promote_custom_phrase
  "engine/processors":
    - ascii_composer
    - recognizer
    - key_binder
    - lua_processor@topup_processor
    - lua_processor@smart_2
    - speller
    - lua_processor@*add_phrase
    - punctuator
    - selector
    - navigator
    - express_editor
  "engine/translators/+":
    - lua_translator@custom_phrase_live

  custom_phrase:
    initial_quality: 1000000
  ascii_composer:
    good_old_caps_lock: false
    switch_key:
      Caps_Lock: clear
      Shift_L: noop
      Shift_R: noop
      Control_L: noop
      Control_R: noop

  switches:
    - name: sbb_disable_full
      reset: 0
      states: ["开₆₃₀全码", "关₆₃₀全码"]

  punctuator:
    full_shape:
      " ": { commit: "　" }
      ",": { commit: ， }
      ".": { commit: 。 }
      "<": [《, 〈, «, ‹]
      ">": [》, 〉, », ›]
      "/": [/, ÷]
      "?": { commit: ？ }
      ";": { commit: ； }
      ":": { commit: ： }
      "'": { pair: ["‘", "’"] }
      '"': { pair: ["“", "”"] }
      '\': [、, ＼]
      "|": [·, ｜, "§", "¦"]
      "`": ｀
      "~": ～
      "!": { commit: ！ }
      "@": [＠, ☯]
      "#": [＃, ⌘]
      "%": [％, "°", "℃"]
      "$": [￥, "$", "€", "£", "¥", "¢", "¤"]
      "^": { commit: …… }
      "&": ＆
      "*": [＊, ·, ・, ×, ※, ❂]
      "(": （
      ")": ）
      "-": －
      "_": ——
      "+": ＋
      "=": ＝
      "[": [「, 【, 〔, ［]
      "]": [」, 】, 〕, ］]
      "{": [『, 〖, ｛]
      "}": [』, 〗, ｝]
    half_shape:
      ",": "，"
      ".": "。"
      "<": "⟪"
      ">": "⟫"
      "/": "/"
      "?": "？"
      ";": "；"
      ":": "："
      "'": { pair: ["‘", "’"] }
      '"': { pair: ["“", "”"] }
      '\': "、"
      "|": ["·", "|", "｜", "§", "¦"]
      "`": "、"
      "~": "～"
      "!": "！"
      "@": "@"
      "#": "#"
      "%": "%"
      "$": "¥"
      "^": "…"
      "&": "&"
      "*": "*"
      "(": "（"
      ")": "）"
      "-": "-"
      "_": ——
      "+": "+"
      "=": "="
      "[": "「"
      "]": "」"
      "{": "『"
      "}": "』"
