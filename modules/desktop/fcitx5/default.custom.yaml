patch:
  switcher:
    caption: '「切换方案」'
    hotkeys:
      - 'Control+grave'
      - 'F4'
  schema_list:
    - schema: keytao
    - schema: keytao-dz
    - schema: keytao-bj
  menu:
    page_size: 6

  ascii_composer:
    good_old_caps_lock: false
    switch_key:
      Caps_Lock: clear
      Shift_L: noop
      Shift_R: noop
      Control_L: noop
      Control_R: noop

  punctuator:
    full_shape:
      " ": { commit: "　" }
      ",": { commit: ， }
      ".": { commit: 。 }
      "<": [《, 〈, «, ‹]
      ">": [》, 〉, », ›]
      "/": [/, ÷]
      "?": { commit: ？ }
      ";": { commit: ； }
      ":": { commit: ： }
      "'": { pair: ["‘", "’"] }
      '"': { pair: ["“", "”"] }
      '\': [、, ＼]
      "|": [·, ｜, "§", "¦"]
      "`": ｀
      "~": ～
      "!": { commit: ！ }
      "@": [＠, ☯]
      "#": [＃, ⌘]
      "%": [％, "°", "℃"]
      "$": [￥, "$", "€", "£", "¥", "¢", "¤"]
      "^": { commit: …… }
      "&": ＆
      "*": [＊, ·, ・, ×, ※, ❂]
      "(": （
      ")": ）
      "-": －
      "_": ——
      "+": ＋
      "=": ＝
      "[": [「, 【, 〔, ［]
      "]": [」, 】, 〕, ］]
      "{": [『, 〖, ｛]
      "}": [』, 〗, ｝]
    half_shape:
      ",": "，"
      ".": "。"
      "<": "⟪"
      ">": "⟫"
      "/": "/"
      "?": "？"
      ";": "；"
      ":": "："
      "'": { pair: ["‘", "’"] }
      '"': { pair: ["“", "”"] }
      '\': "、"
      "|": ["·", "|", "｜", "§", "¦"]
      "`": "、"
      "~": "～"
      "!": "！"
      "@": "@"
      "#": "#"
      "%": "%"
      "$": "¥"
      "^": "…"
      "&": "&"
      "*": "*"
      "(": "（"
      ")": "）"
      "-": "-"
      "_": ——
      "+": "+"
      "=": "="
      "[": "「"
      "]": "」"
      "{": "『"
      "}": "』"
