# 重点色
AccentColorField=

[Metadata]
# 名称
Name=noctalia
# 版本
Version=0
# 作者
Author=bkctwy
# 描述
Description="A Fcitx5 rouned theme based on the Dracula color scheme, recolored by Noctalia."

[InputPanel]
# 一般文字颜色
NormalColor={{colors.on_surface.default.hex}}
# 高亮背景颜色
HighlightColor={{colors.primary.default.hex}}
# 高亮背景透明度
HighlightBackgroundColor=#00000000
# 高亮候选词文字颜色（on_primary 保证与 primary 底色对比）
HighlightCandidateColor={{colors.on_primary.default.hex}}
# KWin 下启用模糊
EnableBlur=False
# 模糊遮罩
BlurMask=
# 竖排列表时使用所有横向空间高亮
FullWidthHighlight=True
# 页面按钮垂直对齐
PageButtonAlignment=Bottom

[InputPanel/BlurMargin]
