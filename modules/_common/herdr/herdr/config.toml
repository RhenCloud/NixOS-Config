onboarding = false

[theme]
name = "dracula"

[keys]
previous_tab = "alt+h"
next_tab = "alt+l"
previous_workspace = "alt+k"
next_workspace = "alt+j"
previous_agent = "alt+i"
next_agent = "alt+o"
focus_pane_left = ["prefix+h", "ctrl+h"]
focus_pane_down = ["prefix+j", "ctrl+j"]
focus_pane_up = ["prefix+k", "ctrl+k"]
focus_pane_right = ["prefix+l", "ctrl+l"]

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

# [[keys.command]]
# key = "ctrl+b"
# type = "plugin_action"
# command = "herdr"
# description = "herdr-sidebar"

[[keys.command]]
key = "ctrl+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktree: switch / create from current branch"

[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "worktrunk.open-with-remotes"
description = "Worktree: switch / create from local or remote branches"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "worktrunk.merge"
description = "Worktree: merge into the target branch"

[[keys.command]]
key = "prefix+shift+n"
type = "plugin_action"
command = "worktrunk.merge-no-squash"
description = "Worktree: merge keeping every commit"

[ui]
show_agent_labels_on_pane_borders = true

[terminal]
default_shell = "/run/current-system/sw/bin/fish"
shell_mode = "auto"

[experimental]
switch_ascii_input_source_in_prefix = true
kitty_graphics = true
pane_history = false
