name: NixOS Build & Cache

on:
  schedule:
    # 每天 UTC 02:00 (北京时间 10:00)
    - cron: '0 2 * * *'
    # 每周日 UTC 04:00 执行 GC (北京时间 12:00)
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      force_upload:
        description: '强制重新上传所有包'
        required: false
        default: 'false'
        type: boolean
      retention_days:
        description: '保留天数（默认 30 天）'
        required: false
        default: '30'
        type: string
      gc_only:
        description: '仅执行 GC（不构建）'
        required: false
        default: 'false'
        type: boolean

env:
  S3_BUCKET: hi168-h5hv6zw90zf-sslnc1b0-s
  S3_ENDPOINT: https://s3.hi168.com
  S3_PREFIX: nix-cache
  RETENTION_DAYS: ${{ inputs.retention_days || '30' }}

jobs:
  gc-cache:
    name: GC Old Packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Install rclone
        run: |
          curl -s https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [s3]
          type = s3
          provider = Other
          access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          endpoint = ${{ env.S3_ENDPOINT }}
          region = auto
          EOF

      - name: Delete old packages
        run: |
          REMOTE="s3:${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}"
          RETENTION_DAYS=${{ env.RETENTION_DAYS }}
          DELETED=0
          KEPT=0
          
          echo "清理 ${RETENTION_DAYS} 天前的包..."
          
          # 获取所有 .tar.xz 文件
          rclone ls "${REMOTE}/" --include "*.tar.xz" | while read -r size path; do
            # 获取文件修改时间
            mod_time=$(rclone lsf "${REMOTE}/${path}" --format "t" 2>/dev/null | head -1)
            
            if [[ -z "$mod_time" ]]; then
              continue
            fi
            
            # 计算文件年龄（天）
            file_epoch=$(date -d "$mod_time" +%s 2>/dev/null || echo 0)
            now_epoch=$(date +%s)
            age_days=$(( (now_epoch - file_epoch) / 86400 ))
            
            if [[ "$age_days" -gt "$RETENTION_DAYS" ]]; then
              echo "删除 ($age_days 天): $path"
              rclone delete "${REMOTE}/${path}" 2>/dev/null
              ((DELETED++))
            else
              ((KEPT++))
            fi
          done
          
          echo "GC 完成: 删除=$DELETED, 保留=$KEPT"
          
          # 更新 index.json 中的 GC 信息
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          rclone cat "${REMOTE}/index.json" 2>/dev/null | jq \
            --arg ts "$TIMESTAMP" \
            --argjson deleted "$DELETED" \
            --argjson kept "$KEPT" \
            --arg days "$RETENTION_DAYS" \
            '. + {gc: {timestamp: $ts, retention_days: ($days | tonumber), deleted: $deleted, kept: $kept}}' \
            > /tmp/index-gc.json 2>/dev/null || {
              cat > /tmp/index-gc.json <<EOF
          {
            "gc": {
              "timestamp": "$TIMESTAMP",
              "retention_days": $RETENTION_DAYS,
              "deleted": $DELETED,
              "kept": $KEPT
            }
          }
          EOF
            }
          
          rclone copy /tmp/index-gc.json "${REMOTE}/index.json"

  build-and-cache:
    name: Build & Cache Packages
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: ${{ inputs.gc_only != 'true' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install transcrypt
        run: |
          curl -sL https://raw.githubusercontent.com/elasticdog/transcrypt/main/transcrypt -o /tmp/transcrypt
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt
          transcrypt --version

      - name: Decrypt secrets (transcrypt)
        run: |
          transcrypt -c aes-256-cbc -p "${{ secrets.TRANSCRYPT_PASSWORD }}" -y

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto
            substituters = https://cache.nixos.org https://hyprland.cachix.org https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Install rclone
        run: |
          curl -s https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [s3]
          type = s3
          provider = Other
          access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          endpoint = ${{ env.S3_ENDPOINT }}
          region = auto
          EOF

      - name: Build system configuration
        run: |
          echo "Building nixos-desktop system configuration..."
          nix build ".#nixosConfigurations.nixos-desktop.config.system.build.toplevel" \
            --no-link \
            --print-out-paths \
            > /tmp/build-path.txt
          
          BUILD_PATH=$(cat /tmp/build-path.txt)
          echo "BUILD_PATH=$BUILD_PATH" >> $GITHUB_ENV
          echo "Build complete: $BUILD_PATH"

      - name: List all packages
        run: |
          echo "Listing all packages..."
          nix-store -q --requisites "$BUILD_PATH" > /tmp/requisites.txt
          
          TOTAL=$(wc -l < /tmp/requisites.txt)
          echo "Total requisites: $TOTAL"
          echo "TOTAL_COUNT=$TOTAL" >> $GITHUB_ENV

      - name: Upload packages to S3
        run: |
          REMOTE="s3:${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}"
          UPLOADED=0
          SKIPPED=0
          FAILED=0
          
          while IFS= read -r store_path; do
            if [[ ! -d "$store_path" ]]; then
              continue
            fi
            
            store_name=$(basename "$store_path")
            
            # 检查是否已存在
            if rclone ls "${REMOTE}/${store_name}.tar.xz" 2>/dev/null | grep -q .; then
              ((SKIPPED++))
              continue
            fi
            
            # 打包并上传
            tmp_tar="/tmp/nix-cache-${store_name}.tar.xz"
            if tar -C "$(dirname "$store_path")" -cJf "$tmp_tar" "$store_name" 2>/dev/null; then
              if rclone copy "$tmp_tar" "${REMOTE}/" 2>/dev/null; then
                ((UPLOADED++))
              else
                echo "Failed to upload: $store_name"
                ((FAILED++))
              fi
              rm -f "$tmp_tar"
            else
              echo "Failed to tar: $store_name"
              ((FAILED++))
            fi
            
            # 每 100 个包输出进度
            TOTAL_READ=$((UPLOADED + SKIPPED + FAILED))
            if (( TOTAL_READ % 100 == 0 )); then
              echo "Progress: uploaded=$UPLOADED, skipped=$SKIPPED, failed=$FAILED"
            fi
          done < /tmp/requisites.txt
          
          echo "Upload complete: uploaded=$UPLOADED, skipped=$SKIPPED, failed=$FAILED"
          echo "UPLOADED=$UPLOADED" >> $GITHUB_ENV
          echo "SKIPPED=$SKIPPED" >> $GITHUB_ENV
          echo "FAILED=$FAILED" >> $GITHUB_ENV

      - name: Generate cache index
        if: always()
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          
          cat > /tmp/index.json <<EOF
          {
            "timestamp": "$TIMESTAMP",
            "host": "nixos-desktop",
            "github_run": "${{ github.run_id }}",
            "github_sha": "${{ github.sha }}",
            "stats": {
              "total_requisites": ${{ env.TOTAL_COUNT || 0 }},
              "uploaded": ${{ env.UPLOADED || 0 }},
              "skipped": ${{ env.SKIPPED || 0 }},
              "failed": ${{ env.FAILED || 0 }}
            },
            "s3": {
              "bucket": "${{ env.S3_BUCKET }}",
              "prefix": "${{ env.S3_PREFIX }}",
              "endpoint": "${{ env.S3_ENDPOINT }}"
            }
          }
          EOF
          
          rclone copy /tmp/index.json "s3:${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}/index.json"
          echo "Cache index uploaded"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/requisites.txt
            /tmp/index.json
          retention-days: 7