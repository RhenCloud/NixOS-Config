name: Build & Push to Cachix

on:
  push:
    branches: [main, master]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "systems/**"
      - "modules/**"
      - "overlays/**"
      - "homes/**"
      - "packages/**"
      - "secrets/**"
      - ".github/workflows/cachix.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "systems/**"
      - "modules/**"
      - "overlays/**"
      - "homes/**"
      - "packages/**"
      - "secrets/**"
      - ".github/workflows/cachix.yml"
  workflow_dispatch:
      inputs:
        deploy:
          description: "构建成功后是否部署"
          required: false
          default: true
          type: boolean

concurrency:
  group: cachix-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        host:
          - nixos-desktop
          - yc-hk-1
          # - arch-server
    name: Build ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: rhencloud
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true   # 禁止自动推送中间产物（.deb 等）

      - name: Setup sops age key
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          if [ -z "$SOPS_AGE_KEY" ]; then
            echo "SOPS_AGE_KEY 未设置，跳过"
            exit 0
          fi
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt

# ========== 构建前检查 ==========
      - name: Flake check
        run: |
          set -euo pipefail
          # 跑 flake 里定义的 checks（eval / 测试 / 格式等）
          nix flake check -L

      # 可选：只求值、不构建，确认当前 matrix host 配置能解析
      - name: Eval host configuration
        run: |
          set -euo pipefail
          echo "==> Evaluating nixosConfigurations.${{ matrix.host }}"
          nix eval --raw \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath"
          echo "OK: ${{ matrix.host }} 配置可求值"

      # ========== 正式构建 ==========
      - name: Build custom packages + overlay packages
        run: |
          set -euo pipefail
          mkdir -p /tmp/out-paths
          : > /tmp/out-paths/list

          echo "==> Building flake packages"
          for name in $(nix eval --json '.#packages.x86_64-linux' --apply 'builtins.attrNames' | jq -r '.[]'); do
            echo "---- .#$name ----"
            nix build ".#packages.x86_64-linux.$name" -L --print-out-paths | tee -a /tmp/out-paths/list
          done

          echo "==> Building overlay-modified packages (auto-discovered)"
          nix build -L --print-out-paths --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              system = "x86_64-linux";
              lib = flake.inputs.nixpkgs.lib;
              helpers = import ./flake/helpers.nix {
                inherit lib;
                inputs = flake.inputs // { self = flake; };
              };
              pkgs0 = import flake.inputs.nixpkgs {
                inherit system;
                config.allowUnfree = true;
              };
              overlays = helpers.overlays;
              overlayAttrNames = lib.unique (
                lib.concatMap (ov: builtins.attrNames (ov pkgs0 pkgs0)) overlays
              );
              pkgs = import flake.inputs.nixpkgs {
                inherit system;
                config.allowUnfree = true;
                inherit overlays;
              };
            in
              map (name: pkgs.${name}) overlayAttrNames
          ' | tee -a /tmp/out-paths/list

          echo "All paths to push:"
          cat /tmp/out-paths/list

      - name: Push to Cachix
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [ ! -s /tmp/out-paths/list ]; then
            echo "没有可推送的路径，跳过"
            exit 0
          fi
          cachix push rhencloud < /tmp/out-paths/list

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      (github.event_name != 'workflow_dispatch' || inputs.deploy == true)
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - node: yc-hk-1
            ssh_port: "45855"
          # - arch-server
    name: Deploy ${{ matrix.node }}
    concurrency:
      group: deploy-${{ matrix.node }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: rhencloud
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Setup sops age key
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          if [ -z "$SOPS_AGE_KEY" ]; then
            echo "SOPS_AGE_KEY 未设置，跳过"
            exit 0
          fi
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt

      - name: Setup SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "DEPLOY_SSH_KEY 未设置"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 可选：预写 known_hosts，减少首次连接交互问题
          # 端口/IP 以 deploy.nix 为准；yc-hk-1 当前为 45855 / 83.229.127.169
          ssh-keyscan -p 45855 -H 83.229.127.169 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy ${{ matrix.node }}
        run: |
          # hostname / sshOpts（含 -p）来自 flake 的 deploy.nodes
          # 这里只补充私钥路径
          nix run github:serokell/deploy-rs -- \
            ".#${{ matrix.node }}" \
            --ssh-opts="-i $HOME/.ssh/deploy_key -p ${{ matrix.ssh_port }} -o StrictHostKeyChecking=accept-new" \
            --auto-rollback true
