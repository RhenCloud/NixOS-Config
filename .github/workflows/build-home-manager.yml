name: Build Home Manager Configuration

on:
  workflow_dispatch:
  push:
    paths:
      - "modules/home/**"
      - "homes/**"
      - "modules/nixos/**"
      - "systems/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/build-home-manager.yml"

permissions:
  contents: read

concurrency:
  group: build-hm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: rhencloud
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Build Home Manager activation package
        run: |
          nix build '.#homeConfigurations."rhencloud@nixos-desktop".activationPackage'

      - name: Archive generation
        run: |
          # copy 到 output/ 避免 result/ 符号链接问题
          mkdir -p output/home-manager-generation
          cp -rL result/* output/home-manager-generation/

      - uses: actions/upload-artifact@v4
        with:
          name: home-manager-generation
          path: output/home-manager-generation/
