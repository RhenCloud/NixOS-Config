name: Build Rime Keytao Config

on:
  push:
    paths:
      - "modules/desktop/fcitx5/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/build-rime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-rime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: rhencloud
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Build rime-keytao package
        run: |
          nix build --no-link '.#rime-keytao'
          rime_dir=$(nix eval --raw '.#rime-keytao.outPath')
          echo "rimedir=$rime_dir" >> "$GITHUB_ENV"

      - name: Assemble Rime config
        run: |
          mkdir -p output/rime/lua

          # 1. 键道基础文件（nix store 为只读，先设可写以便覆盖）
          cp -r "${{ env.rimedir }}/share/rime-data/"* output/rime/
          chmod -R +w output/rime/

          # 2. 自定义 Lua 脚本
          cp modules/desktop/fcitx5/rime/lua/*.lua output/rime/lua/

          # 3. 自定义 YAML 配置
          cp modules/desktop/fcitx5/default.custom.yaml output/rime/
          cp modules/desktop/fcitx5/keytao.custom.yaml output/rime/

          # 4. 创建空的 custom_phrase.txt（用户自行编辑）
          touch output/rime/custom_phrase.txt

      - name: Package Rime config
        run: |
          cd output
          zip -r ../rime-keytao-config.zip rime/

      - uses: actions/upload-artifact@v4
        with:
          name: rime-keytao-config
          path: rime-keytao-config.zip

  build-fcitx5-themes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package fcitx5 themes
        run: |
          mkdir -p output/themes
          cp -r modules/desktop/fcitx5/fcitx5/themes/* output/themes/
          cp -r modules/desktop/fcitx5/themes/* output/themes/ 2>/dev/null || true
          cd output && zip -r ../fcitx5-themes.zip themes/

      - uses: actions/upload-artifact@v4
        with:
          name: fcitx5-themes
          path: fcitx5-themes.zip
