name: Build CloudKeyTao Rime Config

# 产物本身由 CloudKeyTao 仓库（scripts/build.sh）构建，本 workflow 只负责
# 把 flake input 已经算好的 rime-data 打成 fcitx5-android 能直接解压的 zip。
#
# 产物本身完全由 CloudKeyTao 仓库的 scripts/build.sh 决定，
# 这里只把 flake lock 钉住的 rime-data 打给 fcitx5-android 用。
# 无 SSH 需求，公共仓库 token 匿名拉取即可。

on:
  push:
    paths:
      # zip 的全部内容来自 cloudkeytao 包，只有锁文件变化才会换产物。
      - "flake.nix"
      - "flake.lock"
      - "modules/desktop/fcitx5/themes/**"
      - "modules/desktop/fcitx5/fcitx5/themes/**"
      - ".github/workflows/build-rime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-rime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: rhencloud
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Build cloudkeytao package
        run: |
          nix build --no-link '.#cloudkeytao'
          rime_dir=$(nix eval --raw '.#cloudkeytao.outPath')
          echo "rimedir=$rime_dir" >> "$GITHUB_ENV"

      - name: Assemble Rime config
        run: |
          # 包的 outPath 就是 Rime 用户目录的内容（不是 share/rime-data 下级）。
          mkdir -p output/rime
          cp -r "${{ env.rimedir }}"/. output/rime/
          chmod -R u+w output/rime

          # 产物已自带 default.custom.yaml、cloudkeytao.custom.yaml、lua/ 与 opencc/，
          # 这里不再覆盖任何文件 —— 只补一个空的用户短语表。
          touch output/rime/custom_phrase.txt

      - name: Package Rime config
        run: |
          cd output
          zip -r ../cloudkeytao-rime-config.zip rime/

      - uses: actions/upload-artifact@v4
        with:
          name: cloudkeytao-rime-config
          path: cloudkeytao-rime-config.zip

  build-fcitx5-themes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package fcitx5 themes
        run: |
          mkdir -p output/themes
          cp -r modules/desktop/fcitx5/fcitx5/themes/* output/themes/
          cp -r modules/desktop/fcitx5/themes/* output/themes/ 2>/dev/null || true
          cd output && zip -r ../fcitx5-themes.zip themes/

      - uses: actions/upload-artifact@v4
        with:
          name: fcitx5-themes
          path: fcitx5-themes.zip
