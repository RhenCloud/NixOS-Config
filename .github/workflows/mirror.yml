name: Mirror Repository

on:
  push:
  delete:
  workflow_dispatch:

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- GitLab ----------
      - name: Mirror to GitLab
        env:
          TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "GITLAB_TOKEN 未设置，跳过 GitLab 镜像"
            exit 0
          fi
          git remote remove gitlab 2>/dev/null || true
          git remote add gitlab "https://oauth2:${TOKEN}@gitlab.com/RhenCloud/NixOS-Config.git"
          git push --mirror --force gitlab

      # ---------- Codeberg ----------
      - name: Mirror to Codeberg
        env:
          TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CODEBERG_TOKEN 未设置，跳过 Codeberg 镜像"
            exit 0
          fi
          git remote remove codeberg 2>/dev/null || true
          git remote add codeberg "https://oauth2:${TOKEN}@codeberg.org/RhenCloud/NixOS-Config.git"
          git push --mirror --force codeberg

      # ---------- cnb.cool ----------
      - name: Mirror to cnb.cool
        env:
          TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CNB_TOKEN 未设置，跳过 cnb.cool 镜像"
            exit 0
          fi
          # cnb.cool 固定用户名为 cnb
          git remote remove cnb 2>/dev/null || true
          git remote add cnb "https://cnb:${TOKEN}@cnb.cool/RhenCloud/NixOS-Config.git"
          git push --mirror --force cnb
