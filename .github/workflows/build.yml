name: Build & Push to Cachix

on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "hosts/**"
      - "modules/**"
      - "overlays/**"
      - "homes/**"
      - "packages/**"
      - "apps/**"
      - "checks/**"
      - "shells/**"
      - "formatter/**"
      - "deploy/**"
      - "secrets/**"
      - "flake/**"
      - "lib/**"
      - "*.nix"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "hosts/**"
      - "modules/**"
      - "overlays/**"
      - "homes/**"
      - "packages/**"
      - "apps/**"
      - "checks/**"
      - "shells/**"
      - "formatter/**"
      - "deploy/**"
      - "secrets/**"
      - "flake/**"
      - "lib/**"
      - "*.nix"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.host }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        host:
          # - nixos-desktop
          - yc-hk-1
          - nixos-homeserver
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: rhencloud
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true

      - name: Setup sops age key
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          if [ -z "$SOPS_AGE_KEY" ]; then
            echo "SOPS_AGE_KEY 未设置，跳过"
            exit 0
          fi
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt

      # - name: Flake check
      #   run: |
      #     set -euo pipefail
      #     nix flake check -L

      - name: Eval host configuration
        run: |
          set -euo pipefail
          echo "==> Evaluating nixosConfigurations.${{ matrix.host }}"
          nix eval --raw \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath"
          echo "OK: ${{ matrix.host }} 配置可求值"

      - name: Build + push to Cachix
        run: |
          set -euo pipefail
          # 一次 nix build 统一调度整个依赖图（toplevel + flake 包 + overlay 包），
          # 非 PR 时用 cachix watch-exec 边构建边推送，自动收集全部新建路径（含闭包）
          # GitHub Actions 会在 shell 执行前展开 matrix 表达式。
          # shellcheck disable=SC2016
          expr='
            let
              flake = builtins.getFlake (toString ./.);
              lib = flake.inputs.nixpkgs.lib;
              host = flake.nixosConfigurations.${{ matrix.host }};
              # 直接复用 CNF 为主机构造的 pkgs，确保架构、nixpkgs.config
              # 与所有自动发现的 overlays 和本地求值保持一致。
              pkgs = host.pkgs;
              system = pkgs.stdenv.hostPlatform.system;
              overlays = builtins.attrValues flake.overlays;
              overlayAttrNames = lib.unique (
                lib.concatMap (ov: builtins.attrNames (ov pkgs pkgs)) overlays
              );
              toplevel = host.config.system.build.toplevel;
              flakePkgs = lib.attrValues flake.packages.${system};
              overlayPkgs = map (name: pkgs.${name}) overlayAttrNames;
            in
              [ toplevel ] ++ flakePkgs ++ overlayPkgs
          '

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            cachix watch-exec rhencloud -- nix build -L --impure --expr "$expr"
          else
            nix build -L --impure --expr "$expr"
          fi
