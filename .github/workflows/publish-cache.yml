name: Publish Nix Cache to Attic

on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "flake/**"
      - "hosts/**"
      - "homes/**"
      - "modules/**"
      - "overlays/**"
      - "packages/**"
      - "apps/**"
      - "checks/**"
      - "shells/**"
      - "formatter/**"
      - "deploy/**"
      - ".github/workflows/publish-cache.yml"
  workflow_dispatch:

permissions:
  contents: read

# 与 auto-update 分开排队：两者都会推缓存，同时跑没有意义
concurrency:
  group: publish-cache
  cancel-in-progress: true

env:
  # 推送必须走直连入口：CF 免费版单请求 100 MB 上限，
  # 而 attic push 是整个 NAR 一个 PUT，GB 级包会被 CF 413。
  ATTIC_SERVER: https://push.rhen.cloud
  ATTIC_CACHE: public

jobs:
  publish:
    name: Build & Publish Cache
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest 可用磁盘只有 ~20GB，预装软件占掉大半，先清掉
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /opt/hostedtoolcache || true
          docker image prune -af 2>/dev/null || true
          df -h / | tail -1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            # 构建时优先复用已有缓存，少重编
            extra-substituters = https://cache.rhen.cloud/public
            extra-trusted-public-keys = public:${{ vars.ATTIC_PUBLIC_KEY }}
            # 磁盘见底时自动 GC 兜底；构建产物由 out-link gcroot 保护
            # 2 GiB / 6 GiB，nix.conf 只接受字面量
            min-free = 2147483648
            max-free = 6442450944

      - name: Install and login Attic
        shell: bash
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ATTIC_TOKEN:-}" ]; then
            echo "::warning::ATTIC_PUSH_TOKEN 未设置，跳过推送"
            exit 0
          fi
          nix profile install nixpkgs#attic-client
          # 上游过滤由 Attic 自己做（缓存已登记 6 个上游 key），
          # 日志里会显示 "N already cached, M in upstream"。
          attic login rhen "$ATTIC_SERVER" "$ATTIC_TOKEN"

      # 一次性构建全部目标会把 runner 磁盘占满，改为逐组构建 → 推送 → 清理，
      # 后续组的共享依赖从刚推送的缓存取回。
      - name: Build, push and clean per target
        shell: bash
        env:
          ATTIC_PUSH_TOKEN: ${{ secrets.ATTIC_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ATTIC_PUSH_TOKEN:-}" ]; then
            echo "::warning::ATTIC_PUSH_TOKEN 未设置，跳过构建"
            exit 0
          fi
          for target in \
            host:nixos-desktop \
            host:yc-hk-1 \
            host:nixos-homeserver \
            flake-packages; do
            ./scripts/ci-build-push.sh "$target"
          done
