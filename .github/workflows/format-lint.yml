name: Format & Lint

on:
  pull_request:
    paths:
      - "**/*.nix"
      - "statix.toml"
      - ".github/workflows/format-lint.yml"
  push:
    branches: [main]
    paths:
      - "**/*.nix"
      - "statix.toml"
      - ".github/workflows/format-lint.yml"
  workflow_dispatch:

concurrency:
  group: format-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR：只检查，不修改
  check:
    name: Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: rhencloud
          skipPush: true

      - name: nixfmt check
        run: |
          set -euo pipefail
          nix shell nixpkgs#nixfmt-rfc-style -c bash -c '
            mapfile -t files < <(git ls-files "*.nix")
            if [ ${#files[@]} -eq 0 ]; then
              echo "No .nix files"
              exit 0
            fi
            if ! nixfmt --check "${files[@]}"; then
              echo
              echo "::error::部分 .nix 未按 nixfmt-rfc-style 格式化。"
              echo "本地修复: nix shell nixpkgs#nixfmt-rfc-style -c nixfmt \$(git ls-files \'*.nix\')"
              echo "或在 main 上触发 Format & Lint 的 Autofix（会直接提交）。"
              exit 1
            fi
          '

      - name: statix check
        run: |
          set -euo pipefail
          nix shell nixpkgs#statix -c statix check .

      - name: deadnix check
        run: |
          set -euo pipefail
          nix shell nixpkgs#deadnix -c deadnix --fail -L .

      - name: gitleaks detect
        run: |
          set -euo pipefail
          nix shell nixpkgs#gitleaks -c gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --no-banner \
            --exit-code 1

      - name: nix flake check
        run: |
          set -euo pipefail
          nix flake check --all-systems

  # main / 手动：nixfmt 后有变更则直接提交到当前分支
  autofix:
    name: Autofix (commit)
    if: >
      github.repository == 'RhenCloud/NixOS-Config' &&
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message || '', 'style: apply nixfmt-rfc-style') &&
      !contains(github.event.head_commit.message || '', '[skip ci]') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要可写 token 才能 push
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Run nixfmt
        run: |
          set -euo pipefail
          nix shell nixpkgs#nixfmt-rfc-style -c bash -c '
            mapfile -t files < <(git ls-files "*.nix")
            if [ ${#files[@]} -eq 0 ]; then
              echo "No .nix files"
              exit 0
            fi
            nixfmt "${files[@]}"
          '

      - name: statix check (report only)
        continue-on-error: true
        run: |
          set -euo pipefail
          nix shell nixpkgs#statix -c statix check .

      - name: Commit & Push changes
        uses: siiway/verified_bot_commit@v0
        with:
          if-no-commit: info
          message: 'style: apply nixfmt-rfc-style'
          files: |
            **
