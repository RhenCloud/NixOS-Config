name: Format & Lint

on:
  pull_request:
    paths:
      - "**/*.nix"
      - "statix.toml"
      - ".github/workflows/format-lint.yml"
  push:
    branches: [main]
    paths:
      - "**/*.nix"
      - "statix.toml"
      - ".github/workflows/format-lint.yml"
  workflow_dispatch:

concurrency:
  group: format-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR：只检查，不修改
  check:
    name: Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: rhencloud
          skipPush: true

      - name: Build flake checks
        run: |
          set -euo pipefail
          nix run nixpkgs#nix-fast-build -- \
            --flake '.#checks.x86_64-linux' \
            --skip-cached \
            --option allow-import-from-derivation true

      - name: nix flake check
        run: |
          set -euo pipefail
          # 静态检查由 nix-fast-build 并行构建；这里保留所有输出的完整求值。
          # 系统闭包由 Build workflow 构建，避免 PR 重复构建大型桌面依赖。
          nix flake check --all-systems --no-build \
            --option allow-import-from-derivation true

  # main / 手动：nixfmt 后有变更则直接提交到当前分支
  autofix:
    name: Autofix (commit)
    if: >
      github.repository == 'RhenCloud/NixOS-Config' &&
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message || '', 'style: apply nixfmt-rfc-style') &&
      !contains(github.event.head_commit.message || '', '[skip ci]') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要可写 token 才能 push
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Run nixfmt
        run: |
          set -euo pipefail
          nix shell nixpkgs#nixfmt-rfc-style -c bash -s <<'EOF'
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.nix')
          if [ ${#files[@]} -eq 0 ]; then
            echo "没有 Nix 文件"
            exit 0
          fi
          nixfmt "${files[@]}"
          EOF

      - name: statix check (report only)
        continue-on-error: true
        run: |
          set -euo pipefail
          nix shell nixpkgs#statix -c statix check .

      - name: Commit & Push changes
        uses: siiway/verified_bot_commit@v0
        with:
          if-no-commit: info
          message: 'style: apply nixfmt-rfc-style'
          files: |
            **
