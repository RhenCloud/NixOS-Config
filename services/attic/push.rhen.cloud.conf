# 推送专用入口：push.rhen.cloud（灰云 A 记录 → 81.31.208.183，AcePanel nginx 反代 atticd）
#
# 为什么需要这条直连入口：attic push 把**整个 NAR 作为一个 PUT 请求体**上传
# （服务端再分块去重，见 attic client/src/api/mod.rs 的 upload_path），
# 而 Cloudflare 免费版单请求上限 100 MB → GB 级包（ant-browser 807 MB、
# wpsoffice-cn 2 GB）会被 CF 直接 413。下载没有请求体大小限制，所以下载走
# CF 隧道（cache.rhen.cloud），推送走这里。
#
# 部署（AcePanel 接管 80/443 之后）：
#   1. 目录  /opt/ace/sites/push.rhen.cloud/{config,ssl,public,log}
#   2. 本文件 → /opt/ace/sites/push.rhen.cloud/config/site.conf
#   3. 证书  复用 cert_id=1 的通配符 *.rhen.cloud，拷到 ssl/{fullchain.pem,privkey.pem}
#   4. 数据库 在 /opt/ace/panel/storage/panel.db 的 websites 表登记一行，
#            否则站点能跑但不会出现在面板里（见 README §2 推送侧）
#   5. /opt/ace/server/nginx/sbin/nginx -t && -s reload
#
# 关键点（不设会出问题）：
#   client_max_body_size      —— 默认 50m，不放开会直接 413。
#   proxy_request_buffering   —— 关掉才能流式上传，否则先落盘再转发。
#   proxy_buffering           —— 下载 NAR 时也不落盘中转。
#   proxy_set_header Host     —— atticd 的 allowed-hosts 校验 Host: push.rhen.cloud。

server {
    listen 80;
    listen [::]:80;
    server_name push.rhen.cloud;

    # 续期用 HTTP-01
    location /.well-known/acme-challenge/ {
        root /opt/ace/server/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name push.rhen.cloud;

    ssl_certificate     /opt/ace/sites/push.rhen.cloud/ssl/fullchain.pem;
    ssl_certificate_key /opt/ace/sites/push.rhen.cloud/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 一次 PUT 可能是数 GB，必须放开
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式转发，不落盘缓冲
        proxy_buffering off;
        proxy_request_buffering off;

        # 大文件慢慢传，别中途断开
        proxy_connect_timeout 30s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }

    access_log /opt/ace/sites/push.rhen.cloud/log/access.log;
    error_log  /opt/ace/sites/push.rhen.cloud/log/error.log warn;
}